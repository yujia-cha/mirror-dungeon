<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      The site's Content Security Policy (M164). GitHub Pages sets no response headers, so the policy
      travels in the page itself — which is also why `frame-ancestors` is missing: a meta tag cannot
      carry it (nor `report-uri`/`sandbox`). Everything the app loads is its own origin: the bundle,
      data, fonts, the OCR worker and its wasm core (`'wasm-unsafe-eval'`; Tesseract.js wraps the
      worker in a blob URL, hence `blob:` under `worker-src`), the guide's videos. `data:` under
      `img-src` is the feedback screenshot (modern-screenshot draws the page through a data URL);
      `'unsafe-inline'` under `style-src` is React's `style` attributes and the `<style>` sheets the
      overlay window copies. The `'sha256-…'` is the pre-paint script below, byte for byte —
      `tests/csp.test.ts` recomputes it, so editing that script means updating the hash here.
      `%ASSET_SRC%` becomes the external image host when `VITE_ASSET_BASE` is set (vite.config.ts),
      and nothing otherwise.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-d4evDn1zK03kFW8JHqVJjsvJvNb9UiJaDJXWyoA/+V4=' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data:%ASSET_SRC%; media-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <!--
      viewport-fit=cover is what makes env(safe-area-inset-*) resolve to anything on a notched
      iPhone; without it the panel pages' inset rules were dead code.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>거울 던전 루트 플래너</title>
    <meta
      name="description"
      content="림버스 컴퍼니 거울 던전에서 덱과 원하는 E.G.O 기프트에 맞는 테마팩 루트를 계산합니다."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- iOS rejects an SVG here, so 「홈 화면에 추가」 needs the PNG. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- Relative, so it resolves under the GitHub Pages sub-path without a build-time substitution;
         `start_url` and `scope` inside it are relative for the same reason. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="canonical" href="%SITE_URL%" />
    <!-- The browser bar follows the app's theme, not the system's (M122): the script below and
         `App` set it, because the app starts dark whatever the system prefers. -->
    <meta name="theme-color" content="#131211" />

    <!--
      The app is passed around as a share link (`#s=…`), so the unfurl in KakaoTalk, Discord and
      Arca Live is the first thing most people see of it. Crawlers do not resolve relative image
      or url values, so these are absolute and come from VITE_SITE_URL at build time.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="거울 던전 루트 플래너" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="거울 던전 루트 플래너" />
    <meta
      property="og:description"
      content="덱 12인과 원하는 E.G.O 기프트를 고르면 층별 테마팩 루트를 계산합니다. 림버스 컴퍼니 비상업 팬 프로젝트."
    />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mirror Dungeon Route Planner" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="거울 던전 루트 플래너" />
    <meta
      name="twitter:description"
      content="덱 12인과 원하는 E.G.O 기프트를 고르면 층별 테마팩 루트를 계산합니다."
    />
    <meta name="twitter:image" content="%SITE_URL%og.png" />

    <script>
      /*
       * The theme and the text size (M123), before the first paint. `index.html` used to hard-code
       * `class="dark"`, so a reader who prefers light saw a dark flash on every load. The store owns
       * both settings once React is up; this only has to agree with it, so it reads the same
       * persisted key and accepts only the store's steps (anything else is 「보통」, no attribute).
       */
      (function () {
        var dark;
        try {
          var saved = JSON.parse(window.localStorage.getItem('md-route-planner') || 'null');
          if (saved && saved.state && typeof saved.state.dark === 'boolean') dark = saved.state.dark;
          var scale = saved && saved.state && saved.state.ui && saved.state.ui.textScale;
          if (scale === 'sm' || scale === 'md' || scale === 'lg' || scale === 'xl')
            document.documentElement.setAttribute('data-text-scale', scale);
        } catch (e) {
          /* private mode, blocked storage, or a half-written blob — fall through to the default */
        }
        // A first visit starts dark (M122), like the store's default.
        if (dark === undefined) dark = true;
        if (dark) document.documentElement.classList.add('dark');
        else document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f6f4');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
